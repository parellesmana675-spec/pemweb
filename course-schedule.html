<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>course-schedule.html</title>
    <style>
        body {
            background-color: #999999;
            font-family: "Times New Roman", Times, serif;
            padding: 20px;
        }

        .container {
            background-color: #cccccc;
            border: 2px solid #333333;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .filename {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .outer-box {
            border: 2px solid #666666;
            padding: 20px;
            background-color: #ffffff;
        }

        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #666666;
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #666666;
            padding: 8px 10px;
            text-align: left;
            font-size: 16px;
        }

        th {
            font-weight: bold;
            background-color: #e0e0e0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="filename">course-schedule.html</div>
        
        <div class="outer-box">
            <h1>Jadwal Kuliah</h1>
            
            <h2>Jadwal Kuliah Semester 1</h2>
            
            <table>
                <tr>
                    <th>Hari</th>
                    <th>Jam</th>
                    <th>Mata Kuliah</th>
                    <th>Ruangan</th>
                </tr>
                <tr>
                    <td>Senin</td>
                    <td>08:00 - 10:00</td>
                    <td>Pemrograman Web</td>
                    <td>Lab 1</td>
                </tr>
                <tr>
                    <td>Selasa</td>
                    <td>10:00 - 12:00</td>
                    <td>Basis Data</td>
                    <td>Lab 2</td>
                </tr>
                <tr>
                    <td>Rabu</td>
                    <td>08:00 - 10:00</td>
                    <td>Algoritma</td>
                    <td>Ruang 201</td>
                </tr>
                <tr>
                    <td>Kamis</td>
                    <td>13:00 - 15:00</td>
                    <td>Sistem Operasi</td>
                    <td>Ruang 202</td>
                </tr>
                <tr>
                    <td colspan="3">Kegiatan Mahasiswa</td>
                    <td>Aula</td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
